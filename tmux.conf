# Shared multiplexer config for tmux (macOS/Linux) and psmux (Windows).
# Install as ~/.tmux.conf on every OS. On Windows, ~/.psmux.conf sources it
# and adds the psmux-only options (see psmux.conf).
# Only tmux-compatible lines here; no run-shell / if-shell so it stays portable.

# ---------- General ----------
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:RGB"   # truecolor passthrough
set -g history-limit 10000
set -g escape-time 10
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g set-titles on
set -g set-titles-string "#S:#W"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off
set -g automatic-rename on

# ---------- Keys (prefix stays Ctrl+b) ----------
set -g mode-keys vi
bind r source-file ~/.tmux.conf \; display "config reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -n M-Left previous-window
bind -n M-Right next-window

# ---------- VS Code Dark+ look (matches alacritty.toml) ----------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#007acc,fg=#ffffff"
set -g status-left-length 30
set -g status-left "#[bold] #S #[nobold]"
set -g status-right-length 50
set -g status-right " #h  %H:%M  %d-%b "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#1e1e1e,fg=#ffffff,bold] #I:#W "
set -g window-status-separator ""
set -g pane-border-style "fg=#3c3c3c"
set -g pane-active-border-style "fg=#007acc"
set -g message-style "bg=#264f78,fg=#ffffff"
set -g message-command-style "bg=#1e1e1e,fg=#d4d4d4"
set -g mode-style "bg=#264f78,fg=#ffffff"
