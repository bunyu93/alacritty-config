# psmux (Windows) config. Install as ~/.psmux.conf
# psmux reads this file INSTEAD of ~/.tmux.conf, so the shared config is
# pulled in explicitly below. Windows-only options live here.

# Keep PSReadLine prediction settings from $PROFILE
# (without this psmux resets PredictionSource to None after the profile runs)
set -g allow-predictions on

# PowerShell 7 in every pane
set -g default-shell pwsh

# Uncomment if TUI apps (opencode, nvim, lazygit) should own mouse selection
# set -g mouse-selection off

# Shared tmux/psmux settings (keys, status bar, colours)
source-file ~/.tmux.conf
